<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viale</title>
<meta name="description" content="A street of verified shops where your AI agent runs your errands, and every step is proven on Concordium.">
<link rel="icon" href="/brand/viale-favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/viale-favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/viale-apple-touch-icon.png">
<meta name="theme-color" content="#1E2B4A">
<meta property="og:title" content="Viale">
<meta property="og:description" content="A street of verified shops where your AI agent runs your errands, and every step is proven on Concordium.">
<meta property="og:image" content="https://viale.nerom.site/brand/viale-og.png">
<meta property="og:url" content="https://viale.nerom.site">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://viale.nerom.site/brand/viale-og.png">
<style>
  :root { --bg:#F6F1E7; --text:#1E2B4A; --muted:#5b6475; --line:#e3ded3; --accent:#2a4d8f; --brass:#C9A14A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:72px 16px; }
  h1 { margin:0 0 20px; line-height:0; }
  h1 img { height:56px; width:auto; }
  p { margin:0 0 16px; color:var(--muted); }
  .lead { color:var(--text); font-size:19px; }
  ul { padding:0; list-style:none; border-top:1px solid var(--line); margin:32px 0 0; }
  li { padding:12px 0; border-bottom:1px solid var(--line); }
  a { color:var(--accent); }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1><img src="/brand/viale-lockup.svg" alt="Viale" width="268" height="56"></h1>
  <p class="lead">A street of verified shops where your AI agent runs your errands, and every step is proven on Concordium.</p>
  <p>The street is being built during the Concordium Trusted Agents Hackathon. Right now this site hosts the shops' agent cards, which Concordium's Agent Registry points to.</p>
  <ul id="cards"><li><small>Loading cards…</small></li></ul>
</main>
<script>
  const ids = ["1406"];
  const list = document.getElementById("cards");
  Promise.all(ids.map(id => fetch(`agents/${id}.json`).then(r => r.json()).then(c => ({ id, c })).catch(() => null)))
    .then(rows => {
      list.innerHTML = "";
      for (const row of rows.filter(Boolean)) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `agents/${row.id}.json`; a.textContent = `#${row.id} ${row.c.name}`;
        const s = document.createElement("small"); s.textContent = ` · agent card`;
        li.append(a, s); list.append(li);
      }
    });
</script>
</body>
</html>
